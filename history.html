<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <title>明日当空 · 历史情绪</title>
  <link rel="stylesheet" href="/css/app.css"/>
</head>
<body>
  <section class="page">
    <header class="site-header">
      <section class="brand">
        <span class="brand-mark">明</span>
        <span class="brand-name">明日当空</span>
      </section>
      <section class="header-actions">
        <a class="nav-link" href="/">情绪</a>
        <a class="nav-link active" href="/history.html">历史</a>
        <a class="nav-link" href="/poster.html">海报</a>
        <button type="button" class="btn-icon" id="refreshBtn" title="刷新">↻</button>
      </section>
    </header>

    <p class="status-bar" id="historyStatus">加载中…</p>

    <article class="card section-card">
      <table class="history-table">
        <thead>
          <tr>
            <th>日期</th>
            <th>情绪分</th>
            <th>等级</th>
            <th>上证涨跌</th>
          </tr>
        </thead>
        <tbody id="historyBody">
          <tr><td colspan="4" class="empty">加载中…</td></tr>
        </tbody>
      </table>
    </article>

    <footer class="site-footer">
      <p><strong>免责声明</strong>：历史数据仅供复盘参考，不构成投资建议。</p>
    </footer>
  </section>

  <script type="module">
    import { initHistoryPage } from '/js/history.js'
    initHistoryPage()
  </script>
</body>
</html>
