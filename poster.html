<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="description" content="明日当空 · 抖音日更海报，一键导出竖版 PNG"/>
  <title>明日当空 · 分享海报</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef4444'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='%231f2937'%3E%E6%98%8E%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/css/app.css?v=20260612b"/>
  <style>
    .poster-page { max-width: 420px; }
    .poster-preview-wrap {
      margin: 16px 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #070b14;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      min-height: 240px;
      position: relative;
    }
    .poster-preview-wrap.loading::after {
      content: '海报生成中…';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    #previewCanvas {
      display: block;
      width: 100%;
      max-width: 100%;
      vertical-align: top;
    }
    .poster-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .poster-actions .btn-primary { flex: 1; }
    .poster-actions .btn-share { background: #1677ff; }
    .poster-actions .btn-secondary { flex: 0 0 auto; }
    .btn-primary, .btn-secondary {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: #ff4d4f;
      color: #fff;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .poster-tips {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .poster-tips li { margin-left: 18px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <section class="page poster-page">
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="明日当空" width="32" height="32"/>
        <span class="brand-name">分享海报</span>
      </div>
      <nav class="header-actions" aria-label="页面导航">
        <a class="nav-link" href="/">情绪</a>
        <a class="nav-link" href="/history.html">历史</a>
        <a class="nav-link active" href="/poster.html">分享</a>
      </nav>
    </header>

    <p class="status-bar" id="statusBar">正在加载…</p>

    <section class="poster-preview-wrap">
      <canvas id="previewCanvas" aria-label="海报预览"></canvas>
    </section>

    <section class="poster-actions">
      <button type="button" class="btn-primary" id="downloadBtn" disabled>下载图片</button>
      <button type="button" class="btn-primary btn-share" id="shareBtn" disabled>转发</button>
      <a href="/" class="btn-secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">返回</a>
    </section>

    <!-- 长按保存弹层（WeChat / 不支持 a.download 时使用） -->
    <div id="imageModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
      <p style="color:#fff;font-size:15px;margin-bottom:16px;text-align:center;">长按图片保存到相册</p>
      <img id="modalImage" alt="海报" style="max-width:100%;max-height:70vh;border-radius:8px;display:block;"/>
      <button id="closeModal" style="margin-top:20px;color:#fff;background:rgba(255,255,255,0.15);border:none;padding:10px 32px;border-radius:8px;font-size:15px;cursor:pointer;">关闭</button>
    </div>

    <footer class="site-footer">
      <section class="footer-contact" aria-label="联系方式">
        <p class="footer-contact-kicker">联系交流</p>
        <div class="footer-contact-grid">
          <div class="footer-contact-chip">
            <span class="footer-contact-icon wechat" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M8.5 4C4.91 4 2 6.46 2 9.5c0 1.62.82 3.07 2.1 4.08L3.5 17l3.24-1.7c.74.2 1.53.31 2.36.31.11 0 .22 0 .33-.01-.24-.7-.37-1.44-.37-2.2 0-3.43 3.13-6.2 7-6.2.39 0 .77.03 1.14.08C17.14 5.13 13.2 4 8.5 4zm-2.75 3.5c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zm5.5 0c-.55 0-1-.45-1-1s.45-1 1-1 1 .45 1 1-.45 1-1 1zM15.5 8c-3.59 0-6.5 2.46-6.5 5.5 0 .76.16 1.48.44 2.13.58-.07 1.17-.11 1.81-.11 4.14 0 7.5 2.77 7.5 6.2 0 .55-.07 1.08-.2 1.59.35.04.7.06 1.06.06 4.59 0 8.5-2.87 8.5-6.5S20.09 8 15.5 8zm-2.25 4c-.41 0-.75-.34-.75-.75s.34-.75.75-.75.75.34.75.75-.34.75-.75.75zm4.5 0c-.41 0-.75-.34-.75-.75s.34-.75.75-.75.75.34.75.75-.34.75-.75.75z"/></svg>
            </span>
            <span class="footer-contact-label">WeChat</span>
            <span class="footer-contact-value">subfoot</span>
            <button type="button" class="footer-contact-copy" data-copy="subfoot" title="复制微信号" aria-label="复制微信号 subfoot">
              <svg class="footer-contact-copy-icon" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
              <svg class="footer-contact-copy-done" aria-hidden="true" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            </button>
          </div>
          <a class="footer-contact-chip" href="mailto:3359409515@qq.com">
            <span class="footer-contact-icon mail" aria-hidden="true">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m2 7 10 7 10-7"/></svg>
            </span>
            <span class="footer-contact-label">邮箱</span>
            <span class="footer-contact-value">3359409515@qq.com</span>
          </a>
        </div>
      </section>
      <p><strong>免责声明</strong>：数据仅供参考，不构成投资建议。</p>
    </footer>

  </section>

  <script type="module" src="/js/poster.js?v=20260609d"></script>
  <script type="module">
    import { initFooterContact } from '/js/footerContact.js?v=20260612b'
    initFooterContact()
  </script>
</body>
</html>
