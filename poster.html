      gap: 8px;
      margin: 12px 0 4px;
      padding: 4px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 10px;

    .poster-mode-btn {
      flex: 1;
      padding: 10px 12px;
      background: transparent;
      border: none;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.18s, color 0.18s;
    }
    .poster-mode-btn:hover { color: var(--text); }
    .poster-mode-btn.is-active {
      background: rgba(255, 77, 79, 0.16);
      color: #ff4d4f;
    }
    .poster-mode-btn .mode-badge {

      align-items: center;

      padding: 1px 6px;
      font-size: 10px;
      line-height: 1.4;
      border-radius: 4px;
      background: rgba(251, 191, 36, 0.18);
      color: #fbbf24;
      font-weight: 600;
    }
    .poster-mode-btn[disabled] {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .btn-primary, .btn-secondary {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;

    .btn-primary {
      background: #ff4d4f;
      color: #fff;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {

      border: 1px solid var(--border);
    }
    .poster-tips {

      padding: 16px;
      background: var(--card);
