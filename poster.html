<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
  <meta name="description" content="明日当空 · 抖音日更海报，一键导出竖版 PNG"/>
  <title>明日当空 · 分享海报</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ef4444'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-family='system-ui,sans-serif' font-size='18' font-weight='700' fill='%231f2937'%3E%E6%98%8E%3C/text%3E%3C/svg%3E"/>
  <link rel="stylesheet" href="/css/app.css?v=20260529m"/>
  <style>
    .poster-page { max-width: 420px; }
    .poster-preview-wrap {
      margin: 16px 0;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: #070b14;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
      min-height: 240px;
      position: relative;
    }
    .poster-preview-wrap.loading::after {
      content: '海报生成中…';
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      font-size: 14px;
      pointer-events: none;
    }
    #previewCanvas {
      display: block;
      width: 100%;
      max-width: 100%;
      vertical-align: top;
    }
    .poster-actions {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .poster-actions .btn-primary { flex: 1; }
    .poster-actions .btn-share { background: #1677ff; }
    .poster-actions .btn-secondary { flex: 0 0 auto; }
    .btn-primary, .btn-secondary {
      border: none;
      border-radius: 12px;
      padding: 14px 20px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      font-family: inherit;
    }
    .btn-primary {
      background: #ff4d4f;
      color: #fff;
    }
    .btn-primary:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: var(--card);
      color: var(--text);
      border: 1px solid var(--border);
    }
    .poster-tips {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.7;
      padding: 16px;
      background: var(--card);
      border-radius: 12px;
      border: 1px solid var(--border);
    }
    .poster-tips li { margin-left: 18px; margin-bottom: 6px; }
  </style>
</head>
<body>
  <section class="page poster-page">
    <header class="site-header">
      <div class="brand">
        <img class="brand-logo" src="/logo.png" alt="明日当空" width="32" height="32"/>
        <span class="brand-name">分享海报</span>
      </div>
      <nav class="header-actions" aria-label="页面导航">
        <a class="nav-link" href="/">情绪</a>
        <a class="nav-link" href="/history.html">历史</a>
        <a class="nav-link active" href="/poster.html">分享</a>
      </nav>
    </header>

    <p class="status-bar" id="statusBar">正在加载…</p>

    <section class="poster-preview-wrap">
      <canvas id="previewCanvas" aria-label="海报预览"></canvas>
    </section>

    <section class="poster-actions">
      <button type="button" class="btn-primary" id="downloadBtn" disabled>下载图片</button>
      <button type="button" class="btn-primary btn-share" id="shareBtn" disabled>转发</button>
      <a href="/" class="btn-secondary" style="display:flex;align-items:center;justify-content:center;text-decoration:none;">返回</a>
    </section>

    <!-- 长按保存弹层（WeChat / 不支持 a.download 时使用） -->
    <div id="imageModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:1000;flex-direction:column;align-items:center;justify-content:center;padding:20px;">
      <p style="color:#fff;font-size:15px;margin-bottom:16px;text-align:center;">长按图片保存到相册</p>
      <img id="modalImage" alt="海报" style="max-width:100%;max-height:70vh;border-radius:8px;display:block;"/>
      <button id="closeModal" style="margin-top:20px;color:#fff;background:rgba(255,255,255,0.15);border:none;padding:10px 32px;border-radius:8px;font-size:15px;cursor:pointer;">关闭</button>
    </div>

  </section>

  <script type="module" src="/js/poster.js?v=20260531a"></script>
</body>
</html>
